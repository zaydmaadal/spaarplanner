name: CI
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,mailpit
      - run: npx supabase test db
      - run: npm run db:types
      - run: git diff --exit-code src/data/database.types.ts
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Auth, REST and the API gateway are all the app needs.
      - run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Environment for the app
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          # Throwaway VAPID pair (P-256, base64url) so the app's env validation passes; nothing sends push here.
          vapid=$(node -e '
            const { publicKey, privateKey } = require("node:crypto").generateKeyPairSync("ec", { namedCurve: "prime256v1" });
            const pub = publicKey.export({ format: "jwk" });
            const raw = Buffer.concat([Buffer.from([4]), Buffer.from(pub.x, "base64url"), Buffer.from(pub.y, "base64url")]);
            console.log(raw.toString("base64url") + " " + privateKey.export({ format: "jwk" }).d);
          ')
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_AUTH_EMAIL_DOMAIN=u.zaydmaadal.site"
            echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=${vapid% *}"
            echo "VAPID_PRIVATE_KEY=${vapid#* }"
            echo "VAPID_SUBJECT=mailto:test@example.com"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_USER_IDS="
          } >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      # playwright.config.ts starts two servers from this one build: SIGNUP_MODE=open on :3000, closed on :3001.
      - run: npx playwright test
